[project]
name = "homeops"
version = "0.1.0"
description = "HomeOps - persistent household-maintenance assistant: MCP server, FastAPI orchestrator and Alexa+-style web simulator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HomeOps contributors" }]
keywords = ["mcp", "model-context-protocol", "home-maintenance", "fastapi", "react"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "mcp>=2.0",
  "pydantic>=2.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.scripts]
homeops = "homeops_core.cli:main"

[project.urls]
Homepage = "https://github.com/example/homeops"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "packages/homeops_core",
  "services/api/homeops_api",
  "services/mcp_server/homeops_mcp_server",
]
# Editable installs put the three source roots on sys.path so `homeops_core`,
# `homeops_api` and `homeops_mcp_server` all import directly from the repo.
dev-mode-dirs = ["packages", "services/api", "services/mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages",
  "services/api",
  "services/mcp_server",
]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
