# HomeOps production stack.
#
#   make env ENV_NAME=prod
#   docker compose --env-file .env.prod up --build
#
# The application stores data in SQLite. Postgres/Redis are optional and grouped
# behind the `infra` profile:
#
#   docker compose --env-file .env.prod --profile infra up --build

services:
  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    container_name: homeops-mcp
    env_file:
      - .env.prod
    volumes:
      - ./data:/app/data
    ports:
      - "8001:8001"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: homeops-api
    env_file:
      - .env.prod
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      mcp:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        # NEXT_PUBLIC_* values are baked into the browser bundle at build time.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: homeops-web
    env_file:
      - .env.prod
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  # --- Optional infrastructure (`--profile infra`) -------------------------
  # Not read by the application yet: all data lives in SQLite.
  postgres:
    profiles: ["infra"]
    image: postgres:16-alpine
    container_name: homeops-postgres
    environment:
      POSTGRES_USER: homeops
      POSTGRES_PASSWORD: homeops
      POSTGRES_DB: homeops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeops"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["infra"]
    image: redis:7-alpine
    container_name: homeops-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
